[workspace]
members = [".", "scripts/fetch_xbrl"]

[package]
name = "kabuto"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "kabuto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
polars = { version = "0.46", features = [
    "parquet",
    "lazy",
    "dtype-full",
    "strings",
    "regex",
] }
